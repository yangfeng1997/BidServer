max_player: 5000
heartbeat_sec: 30
routeragent_sock_path: "/tmp/bidserver_single_ra_multi_gate.sock"
logger_group:
  main:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr7
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  res:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr7_res
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  tracing:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr7_tracing
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
