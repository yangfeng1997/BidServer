max_player: 5000
heartbeat_sec: 30
routeragent_sock_path: "/tmp/gameserver_cross_ra2.sock"
logger_group:
  main:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr1
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  res:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr1_res
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  tracing:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: lobbysvr1_tracing
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
