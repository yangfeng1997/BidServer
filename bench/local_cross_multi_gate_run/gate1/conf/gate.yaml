listen_tcp: "0.0.0.0:7401"
listen_ws: "0.0.0.0:7501"
max_conn: 20000
heartbeat_sec: 30
routeragent_sock_path: "/tmp/gameserver_cross_ra1.sock"
logger_group:
  main:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: gatesvr1
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  res:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: gatesvr1_res
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
  tracing:
    level: warn
    format: console
    stderr_also: false
    dir: "../log"
    basename: gatesvr1_tracing
    max_size_mb: 100
    max_backups: 24
    rotate_by_hour: true
