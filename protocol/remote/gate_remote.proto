syntax = "proto3";

package protocol.remote;

import "google/protobuf/empty.proto";
import "protocol/common/options.proto";

option go_package = "project/protocol/remote;remotepb";

message RPC_SendToClient_Ntf {
  int64 uid = 1;
  string session_id = 2;
  uint32 cmd_id = 3;
  bytes payload = 4;
}
message RPC_BindSession_Ntf {
  string session_id = 1;
  int64 uid = 2;
  map<uint32, uint32> bound_nodes = 3;
}
message RPC_SetBound_Ntf {
  int64 uid = 1;
  uint32 server_type = 2;
  uint32 node_id = 3;
}

service GateRemote {
  option (protocol.common.kind) = BACKEND;
  option (protocol.common.server_type) = ST_GATESVR;

  rpc SendToClient(RPC_SendToClient_Ntf) returns (google.protobuf.Empty);
  rpc BindSession(RPC_BindSession_Ntf) returns (google.protobuf.Empty);
  rpc SetBound(RPC_SetBound_Ntf) returns (google.protobuf.Empty);
}
